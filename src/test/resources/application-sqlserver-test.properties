# OrchidLab4Test là database dành riêng cho test, có thể tạo/xóa bảng.
spring.datasource.url=${TEST_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=OrchidLab4Test;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}
