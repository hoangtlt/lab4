spring.application.name=lab4-orchid-api
server.port=${SERVER_PORT:8080}

# Có thể đổi URL, username, password bằng biến môi trường trong IntelliJ/PowerShell.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=OrchidDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}

# update giữ lại dữ liệu sau khi khởi động lại, phục vụ yêu cầu T12.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
